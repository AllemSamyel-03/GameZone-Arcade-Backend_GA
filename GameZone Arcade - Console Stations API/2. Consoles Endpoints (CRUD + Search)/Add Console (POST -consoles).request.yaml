$kind: http-request
name: Add Console (POST /consoles)
url: "{{baseUrl}}/consoles"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Station 7 - Nintendo Switch OLED",
      "platform": "Nintendo Switch"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 201 Created', function () { pm.response.to.have.status(201); });
      pm.test('Returns created console with ID', function () {
          var json = pm.response.json();
          pm.expect(json.id).to.be.a('number');
      });
    language: text/javascript
order: 4000
