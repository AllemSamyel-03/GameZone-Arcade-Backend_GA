$kind: http-request
url: "{{baseUrl}}/consoles/4"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () { pm.response.to.have.status(200); });
      pm.test('Console ID is 4', function () {
          var json = pm.response.json();
          pm.expect(json.id).to.eql(4);
      });
    language: text/javascript
order: 3000
