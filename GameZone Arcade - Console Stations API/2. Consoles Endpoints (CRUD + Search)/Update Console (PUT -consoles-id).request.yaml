$kind: http-request
name: Update Console (PUT /consoles/:id)
url: "{{baseUrl}}/consoles/1"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Station 1 - PlayStation 5 Slim",
      "platform": "PlayStation 5"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 200 OK', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 5000
