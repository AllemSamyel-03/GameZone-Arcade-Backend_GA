$kind: http-request
name: Search Consoles by Platform (?platform=PlayStation)
url: "{{baseUrl}}/consoles?platform=PlayStation"
method: GET
queryParams:
  platform: PlayStation
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () { pm.response.to.have.status(200); });
      pm.test('All returned consoles match PlayStation', function () {
          var json = pm.response.json();
          json.forEach(c => pm.expect(c.platform.toLowerCase()).to.include('playstation'));
      });
    language: text/javascript
order: 2000
